services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: urbanlink_flow
      POSTGRES_USER: urbanlink
      POSTGRES_PASSWORD: urbanlink_dev
    ports:
      - "5432:5432"
    volumes:
      - dados_urbanlink:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanlink -d urbanlink_flow"]
      interval: 5s
      timeout: 3s
      retries: 20

  aplicacao:
    build: .
    depends_on:
      banco:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: altere-esta-chave-antes-de-publicar-urbanlink
      DB_DRIVER: postgresql
      URL_BANCO: postgresql://urbanlink:urbanlink_dev@banco:5432/urbanlink_flow
      BANCO_SSL: "false"
      DB_AUTO_MIGRATE: "true"
    ports:
      - "3000:3000"

volumes:
  dados_urbanlink:
